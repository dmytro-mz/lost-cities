[project]
name = "lostcities"
version = "0.3.0"
description = "Lost Cities — a two-player expedition card game: rules engine, bots and a multiplayer browser game"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dmytro Moroz" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lostcities = "lostcities:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
